name: Build Nova APK

on:
  push:
    branches:
      - nova-update
    paths:
      - 'Nova-updated-project.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract updated Nova project
        run: |
          test -f Nova-updated-project.zip
          mkdir -p "$RUNNER_TEMP/nova-extract"
          unzip -q Nova-updated-project.zip -d "$RUNNER_TEMP/nova-extract"
          test -f "$RUNNER_TEMP/nova-extract/nova_src/settings.gradle.kts"
          echo "NOVA_PROJECT_DIR=$RUNNER_TEMP/nova-extract/nova_src" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          wget -q --tries=3 https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Download Hindi Vosk model
        working-directory: ${{ env.NOVA_PROJECT_DIR }}
        run: |
          set -euo pipefail
          wget -q --tries=3 https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          unzip -q vosk-model-small-hi-0.22.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model
          mv vosk-model-small-hi-0.22 app/src/main/assets/model
          test -d app/src/main/assets/model/am

      - name: Build debug APK
        working-directory: ${{ env.NOVA_PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-debug-apk
          path: ${{ env.NOVA_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
