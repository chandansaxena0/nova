name: Build Nova APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: unzip -q project.zip -d proj

      - name: Download free Hindi voice model
        run: |
          wget -q --tries=3 https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          unzip -q vosk-model-small-hi-0.22.zip
          mkdir -p proj/app/src/main/assets
          mv vosk-model-small-hi-0.22 proj/app/src/main/assets/model
          test -d proj/app/src/main/assets/model/am

      - name: Android SDK pieces
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;34.0.0" > /dev/null || true

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> $GITHUB_PATH

      - name: Build APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" proj/app/build/outputs/apk/debug/app-debug.apk \
            --title "Nova v${{ github.run_number }}" \
            --notes "Download app-debug.apk and install it on your phone."
