
name: Build Nova APK

on:
  push:
    branches: [nova-update]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract updated Nova project
        run: |
          unzip -q Nova-updated-project.zip -d extracted
          test -f extracted/nova_src/settings.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Download Hindi Vosk model
        working-directory: extracted/nova_src
        run: |
          wget -q --tries=3 https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          unzip -q vosk-model-small-hi-0.22.zip
          mkdir -p app/src/main/assets
          mv vosk-model-small-hi-0.22 app/src/main/assets/model
          test -d app/src/main/assets/model/am

      - name: Build APK
        working-directory: extracted/nova_src
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-debug-apk
          path: extracted/nova_src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
