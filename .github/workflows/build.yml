name: Nova v7 Android APK

on:
  push:
    branches: [ main, master, nova-v6, nova-v7 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract uploaded project ZIP (if present)
        run: |
          if [ -f project.zip ]; then
            unzip -o project.zip -d .
          fi

      - name: Bundle openWakeWord ONNX backbone models
        run: |
          mkdir -p app/src/main/assets/wake
          curl -fSL "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/melspectrogram.onnx" -o app/src/main/assets/wake/melspectrogram.onnx || true
          curl -fSL "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/embedding_model.onnx" -o app/src/main/assets/wake/embedding_model.onnx || true
          ls -lh app/src/main/assets/wake/

      - name: Bundle Vosk wake-phrase model (works offline, no first-run download)
        run: |
          if [ ! -f app/src/main/assets/model/am/final.mdl ]; then
            wget -q https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip -O vosk.zip || true
            if [ -s vosk.zip ]; then
              unzip -q vosk.zip -d vosk_tmp
              mkdir -p app/src/main/assets/model
              cp -r vosk_tmp/*/* app/src/main/assets/model/
            fi
          fi
          ls app/src/main/assets/model || echo "model not bundled (app will download it on first run)"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build Nova v7.0 Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish APK as a GitHub Release (easy download on phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Nova.apk
          gh release create "nova-run-${{ github.run_number }}" Nova.apk \
            --title "Nova build ${{ github.run_number }}" \
            --notes "Debug APK. Install over the old Nova app." --latest

      - name: Upload Nova v7.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-v7.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
